name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      # actionlint also shellchecks every run step; style-level notes do not fail the build.
      - name: actionlint
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: ./actionlint -color

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every workflow parses
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          files = glob.glob(".github/workflows/*.y*ml")
          if not files:
              sys.exit("no workflows found")
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print("ok", f)
          PY

  # The one check main requires, so a job added later is covered without changing the ruleset.
  ci-ok:
    name: CI ok
    if: always()
    needs: [lint, yaml]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [[ "${{ join(needs.*.result, ' ') }}" =~ ^(success\ ?)+$ ]]
